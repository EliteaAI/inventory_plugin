# Default plugin configuration
# These can be overridden in configs/inventory_plugin.yml

service_location_url: http://127.0.0.1:8091
default_bucket: inventory-graphs

# Cache configuration for local graph storage
# Graphs can be 100MB+ each, so be conservative with limits
cache:
  # Base path for local graph cache
  base_path: /data/graphs

  # Remove graphs not accessed in N days
  max_age_days: 2

  # Maximum total cache size in GB (100MB per graph = ~50 graphs at 5GB)
  max_cache_size_gb: 5.0

  # Maximum number of cached graphs (regardless of size)
  max_graphs: 50

  # How often to run cleanup (in seconds)
  housekeeping_interval_seconds: 3600  # 1 hour

# Platform connection for artifacts API (set via environment or override config)
# ai_run_platform_url: http://pylon_main:8080/api/v1/providers/register
# ai_run_platform_token: ""
